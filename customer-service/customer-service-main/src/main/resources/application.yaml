feign:
  sentinel:
    enabled: true
server:
  port: 8551
  forward-headers-strategy: framework

spring:
  data:
    redis:
      host: localhost
      port: 6379
  application:
    name: customer-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8081
        port: 8719
      eager: true
      web-context-unify: false
    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_customer
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
